version = "5.0"
name = "basemind"
# AGENTS.md and CLAUDE.md are hand-authored in this fork; never let generation overwrite them.
skip_outputs = ["instructions"]
description = "Code-map MCP server + scanner — pure-Rust, content-addressed, Fjall-backed inverted index."
gitignore = true

presets = ["claude", "codex"]

builtins = ["rust", "cicd", "documentation", "observability", "default-commands"]
# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
agents_md = false

[plugin]
name = "basemind"
version = "0.39.0"
display_name = "basemind"
description = "Full AI context layer over MCP — tree-sitter code-map, document RAG (PDF/Office/HTML/email + OCR + reranker), shared agent memory, on-demand web crawl, git history + blame + per-symbol diff. 300+ languages, 10+ coding-agent harnesses, content-addressed Fjall + LanceDB."
homepage = "https://github.com/Goldziher/basemind"
repository = "https://github.com/Goldziher/basemind"
license = "MIT"
category = "developer-tools"
keywords = ["mcp", "agent-context", "rag", "code-map", "tree-sitter"]
tags = ["mcp", "code-intelligence", "rag", "tree-sitter", "git", "embeddings"]
runtimes = ["hermes"]
content_root = "."

[plugin.author]
name = "Na'aman Hirschfeld"
email = "nhirschfeld@gmail.com"
url = "https://github.com/Goldziher"

[plugin.hermes]
source = "plugin/.hermes/package/src/basemind_hermes_plugin/hermes.py"
requires_python = ">=3.9"


[[mcp_servers]]
name = "ai-rulez"
description = "Manage AI governance config via MCP."
command = "npx"
args = ["-y", "ai-rulez@5.14.1", "mcp"]

[[marketplaces]]
name = "basemind"
source = "Goldziher/basemind"
type = "github"

[[plugins]]
marketplace = "basemind"
name = "basemind"
scope = "project"
enabled = true

# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
[header]
hashes = "full"

# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
[mcp]
self_server = false

# The local ADR intentionally shadows the universal documentation builtin of the same name.
[lint]
allow_overrides = ["adr-immutability"]

# Every authored skill is mirrored verbatim into eight harness bundles (.cursor-plugin/,
# opencode-plugin/, plugin/.hermes/, ...). AR701 is description-duplicate: those mirrors are
# deliberately identical to skills/, so the finding is informational here, not a defect.
[lint.severity]
AR701 = "info"

# OKF context/rules link to real repository docs under docs/, which is outside the .ai-rulez
# bundle; the links are valid in the checkout, not broken references.
[[lint.accept]]
rule = "AR9B2"
path = ".ai-rulez/context/crate-layout.md"
match = "docs/"
reason = "link targets are repo docs outside the governance bundle"

[[lint.accept]]
rule = "AR9B2"
path = ".ai-rulez/rules/release-versioning.md"
match = "docs/"
reason = "link targets are repo docs outside the governance bundle"

# This fork carries a wider governance tree than the stock 32 KiB Codex AGENTS.md chain.
[[lint.accept]]
rule = "AR964"
path = ".ai-rulez/config.toml"
match = "AGENTS.md chain limit"
reason = "extended fork governance content is intentionally loaded by operators"

# The development .mcp.json launches the local binary while the shipped plugin uses
# ${PLUGIN_ROOT}; one harness reads only one of them.
[[lint.accept]]
rule = "AR602"
path = ".mcp.json"
match = "basemind"
reason = "root harness MCP config intentionally differs from the plugin manifest"
