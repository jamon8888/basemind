name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # ~keep The `full` feature build (ONNX + lancedb + vendored stack-graphs) produces huge debug objects
  # ~keep that exhaust the standard runners' disk — surfacing as an `ld` bus error (truncated object) on
  # ~keep Linux and an explicit ENOSPC on macOS. Level 1 keeps panic file:line (so backtraces stay useful)
  # ~keep while dropping the variable/type DWARF that dominates the size.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  # ~keep The Linux `full` leg is the tightest of the five and still hit ENOSPC at level 1 even after
  # ~keep the purge below, so `matrix.debug` overrides it to 0 there. Panic locations
  # ~keep (`file.rs:line:col`) come from `core::panic::Location` and survive; what is lost is line
  # ~keep numbers inside RUST_BACKTRACE frames.

jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true

  test:
    name: test / ${{ matrix.os }} / ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      CARGO_PROFILE_DEV_DEBUG: ${{ matrix.debug }}
      CARGO_PROFILE_TEST_DEBUG: ${{ matrix.debug }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
            timeout_minutes: 30
            debug: "1"
          - os: ubuntu-latest
            features: "full"
            # ~keep 60 was sized when this leg died early on ENOSPC; now that it runs the whole
            # ~keep suite it needs the same budget as the other `full` leg — it passed `cargo test`
            # ~keep and was cut off mid `cargo build --release` at exactly 60m. 90 then proved too
            # ~keep tight on a COLD cache: a dependency refresh changes `Cargo.lock`, misses the
            # ~keep rust-cache key, and rebuilds debug + release from scratch, which roughly doubles
            # ~keep both `full` legs (Linux 38m -> 79m, macOS 55m -> past 90m). The ceiling has to
            # ~keep cover the cold run, because a leg that times out never saves a cache and so stays
            # ~keep cold on every retry.
            # ~keep 135 then proved too tight once `full` gained the candle/ort stack (ner-candle,
            # ~keep PR #26): the 2026-09-27 cold run burned the whole 135m inside `cargo test` and
            # ~keep was cancelled before any step could save a cache. 240 covers cold + candle.
            timeout_minutes: 240
            debug: "0"
          - os: macos-latest
            features: ""
            timeout_minutes: 30
            debug: "1"
          - os: macos-14
            features: "full"
            # ~keep Same cold-cache budget as the Linux `full` leg above (including the candle note:
            # ~keep macOS cold + candle also blew 135m, PR #26).
            timeout_minutes: 240
            debug: "1"
          - os: windows-latest
            features: "comms shells"
            timeout_minutes: 60
            debug: "1"
    steps:
      - uses: actions/checkout@v4

      # ~keep The `full` build is disk-heavy; reclaim space up front on the legs that build it so the
      # ~keep debug + release target dirs and the downloaded ONNX models don't hit ENOSPC.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux' && matrix.features == 'full'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          # ~keep The list above still left the leg short by a few GB (chronic ENOSPC mid-`cargo test`).
          # ~keep None of the toolchains below are used by this job: it needs rustup, the apt system
          # ~keep deps installed in the next step, and nothing else.
          sudo rm -rf /usr/local/.ghcup /usr/share/swift /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/miniconda /opt/az || true
          sudo apt-get clean || true
          sudo docker image prune --all --force || true
          df -h /
      - name: Free disk space (macOS)
        if: runner.os == 'macOS' && matrix.features == 'full'
        run: |
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        if: matrix.features == 'full'
        uses: ./.github/actions/install-system-deps

      - name: Install protoc (Linux, default-features)
        if: runner.os == 'Linux' && matrix.features == ''
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS, default-features)
        if: runner.os == 'macOS' && matrix.features == ''
        run: brew install protobuf

      # ~keep mold and sccache were both tried here and both removed again on 2026-10-10.
      # ~keep mold (2.30.0, via apt) installed and exported `-C link-arg=-fuse-ld=mold`, and the
      # ~keep `full` leg then failed with `could not find native static library 'onnxruntime'` from
      # ~keep `ort-sys`. Whatever the mechanism — `ort` resolves ONNX Runtime through its build
      # ~keep script, and forcing the linker changed the result — a faster linker is not worth a
      # ~keep broken `full` leg, and it was not reproducible locally to explain first.
      # ~keep sccache: `mozilla-actions/sccache-action@v0.0.9` does not accept `rustc-wrapper` or
      # ~keep `cache-size`; the real inputs are `version`, `token`, `disable_annotations`. The
      # ~keep action warned and ignored both, so `RUSTC_WRAPPER` was never set and sccache served
      # ~keep zero compilations — it was inert while appearing configured. Reinstating it means
      # ~keep pinning the action version and verifying `RUSTC_WRAPPER` reaches the env, not just
      # ~keep that the step is present.

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.features }}
          # ~keep Without this the leg has a doom loop. rust-cache does not save when a job fails or
          # ~keep is cancelled, so a leg that exceeds its timeout leaves no cache behind — and the
          # ~keep retry, being cold, is the run most likely to exceed the timeout again. Observed on
          # ~keep 2026-10-09: `ubuntu-latest / full` cancelled at exactly 240m, then re-ran cold.
          cache-on-failure: true

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --tests --features "${{ matrix.features }}" -- -D warnings

      # ~keep `--no-fail-fast`: plain `cargo test` stops at the first failing test BINARY, so a leg
      # ~keep reports one target's failures and hides every straggler behind it. A cross-cutting
      # ~keep change leaves failures in several binaries at once, and discovering them one CI
      # ~keep round-trip at a time costs an afternoon per release.
      - name: cargo test
        run: cargo test --workspace --features "${{ matrix.features }}" --quiet --no-fail-fast

      # ~keep The tui `replay` feature (scripted model + PTY e2e) is a basemind-tui feature, not a root
      # ~keep one, so the workspace test above compiles it out. Run it explicitly on the unix default legs
      # ~keep (the tests are `unix`-gated; portable-pty supplies its own PTY, so no real TTY is needed).
      - name: cargo test (basemind-tui replay + PTY)
        if: runner.os != 'Windows' && matrix.features == ''
        run: cargo test -p basemind-tui --features replay --quiet --no-fail-fast

      # ~keep `agent-tui` / `desktop-ui` gate the launcher subcommands for the two unreleased
      # ~keep front-ends, so they are in no matrix leg and in no release build — which leaves
      # ~keep `src/agent_cmd.rs` and `src/ui_cmd.rs` (and their unit tests) compiled by nothing.
      # ~keep This step is their only coverage; drop it when the front-ends ship and the features fold
      # ~keep back into `full`. Reuses the `full` leg's cache by building on top of it.
      - name: cargo clippy + test (front-end launchers)
        if: runner.os == 'Linux' && matrix.features == 'full'
        run: |
          cargo clippy --bin basemind --features full,agent-tui,desktop-ui -- -D warnings
          cargo test --bin basemind --features full,agent-tui,desktop-ui --quiet --no-fail-fast

      # ~keep 23 minutes of a 73-minute leg — 32% — and it is the largest single cost in CI.
      # ~keep A release profile is a different fingerprint from everything above it, so this does
      # ~keep not reuse the debug or test build: it recompiles the whole dependency graph.
      # ~keep `publish.yaml` already builds `--release` for all six release targets, so a release
      # ~keep that does not compile is caught there — but that is *after* the tag, which is too
      # ~keep late to fix.
      # ~keep So it runs on pushes to main and not on pull requests: PR latency drops by ~23m,
      # ~keep and the release commit itself is still checked before anything is tagged. A release-only
      # ~keep break introduced in a PR is caught on merge instead, which is a round-trip, not a
      # ~keep release.
      - name: cargo build --release
        if: github.event_name == 'push'
        run: cargo build --release --quiet --bin basemind --features "${{ matrix.features }}"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  memory-ceiling:
    name: scan under a 1 GiB cgroup (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Issue #62 was reported from a daemon under a systemd `MemoryMax`, and the whole class was
      # invisible to the matrix above because no leg there ever runs under a memory cgroup. A scope
      # with a real ceiling turns an unbounded scan into an OOM kill (137) instead of a slow green
      # leg, so this is the one job that reproduces the reporter's environment rather than
      # approximating it.
      #
      # A SYSTEM scope via sudo, not `systemd-run --user`: a GitHub runner has no user session bus,
      # so the `--user` form fails to start and would report a green leg that never enforced
      # anything -- the precise failure mode this job exists to rule out.  ~keep
      - name: Build the scanner
        run: cargo build --bin basemind

      - name: Generate a synthetic corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/corpus/src
          cd /tmp/corpus
          git init -q .
          for f in $(seq 0 2999); do
            {
              echo "use std::collections::HashMap;"
              for i in $(seq 0 60); do
                printf 'pub fn module_%s_item_%s(a: u64, b: &str) -> HashMap<String, usize> { let _ = b; HashMap::new() }\n' "$f" "$i"
              done
            } > "src/module_$f.rs"
          done
          # The scan runs as root inside the scope, so the repo must be trusted for that user too.
          sudo git config --system --add safe.directory /tmp/corpus

      - name: Confirm the scope really enforces a ceiling
        run: |
          set -euo pipefail
          # Prove the harness before trusting its verdict: a scope that silently fails to apply
          # MemoryMax would make the scan step pass for the wrong reason.
          if sudo systemd-run --scope -p MemoryMax=64M -p MemorySwapMax=0 \
               bash -c 'tail /dev/zero'; then
            echo "MemoryMax was NOT enforced: a process that should have been killed survived."
            echo "This job cannot vouch for the scan step, so fail rather than report a false pass."
            exit 1
          fi
          echo "confirmed: the scope enforces MemoryMax"

      - name: Scan under MemoryMax=1G
        run: |
          set -euo pipefail
          sudo systemd-run --scope -p MemoryMax=1G -p MemorySwapMax=0 \
            env BASEMIND_DATA_HOME=/tmp/bm-data \
            ./target/debug/basemind scan --root /tmp/corpus
          echo "scan completed inside a 1 GiB ceiling"

  hardening:
    name: hardening harness (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: Swatinem/rust-cache@v2

      - name: run harden.sh
        run: ./scripts/harden.sh

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harden-results
          path: /tmp/basemind-harden/results.ndjson
