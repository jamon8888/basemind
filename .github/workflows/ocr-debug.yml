# Temporary: prints SHA-256 fingerprints (never values) of the OCR wiring so
# the configured secret can be compared against a known-good key offline.
# Delete after verification.
name: OCR secret fingerprint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print fingerprints
        env:
          KEY: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          URL: ${{ secrets.OCR_LLM_URL }}
        run: |
          echo "key_sha256=$(printf %s "$KEY" | shasum -a 256 | cut -d' ' -f1)"
          echo "url_sha256=$(printf %s "$URL" | shasum -a 256 | cut -d' ' -f1)"
          echo "url_host=$(printf %s "$URL" | sed -E 's#^(https?://[^/]+).*#\1#')"
          echo "model=${{ vars.OCR_LLM_MODEL }}"
          echo "use_anthropic=${{ vars.OCR_LLM_USE_ANTHROPIC }}"
