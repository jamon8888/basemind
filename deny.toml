[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
  "RUSTSEC-2025-0119",
  "RUSTSEC-2024-0436",
  "RUSTSEC-2025-0134",
  "RUSTSEC-2025-0057",
  # bincode 1.3.3 is unmaintained but declared complete; pulled in only by rmux-proto.
  "RUSTSEC-2025-0141",
  # unsafe-libyaml is unmaintained; pulled in only by serde_yaml_ng via lindera -> lance-tokenizer.
  "RUSTSEC-2024-0449",
  # Fork-line advisory carried by our pinned dependency set; regenerate via `cargo deny` when the
  # merge settles.
  "RUSTSEC-2026-0285",
  # zip 8.6.0 is transitive only (calamine via xberg, candle-core via xberg-gliner); both require
  # zip ^8 and the fixes shipped in >=9.0.0 exclusively. basemind reads archives through those
  # crates and never calls the vulnerable ZipArchive::extract / stream-extraction APIs.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  # Transitive advisories in the all-features Lance/Arrow and document-parser
  # graph. Keep the dependency graph pinned for this release candidate; these
  # are tracked for remediation when upstream fixes are available.
  "RUSTSEC-2026-0258",
  "RUSTSEC-2026-0418",
  "RUSTSEC-2026-0173",
  "RUSTSEC-2026-0414",
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  "RUSTSEC-2023-0071",
  "RUSTSEC-2026-0346",
  "RUSTSEC-2026-0349",
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
  "RUSTSEC-2026-0382",
  "RUSTSEC-2026-0391",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2026-0403",
  "RUSTSEC-2026-0410",
]
[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CDLA-Permissive-2.0",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "Unicode-3.0",
  "BSL-1.0",
  "0BSD",
  "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "zstd-sys"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
name = "zstd-safe"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
name = "zstd"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "nucleo-matcher"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "uluru"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "colored"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

[[licenses.exceptions]]
name = "inferno"
allow = ["CDDL-1.0"]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
